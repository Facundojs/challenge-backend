<text class="ax" x="615" y="406" text-anchor="middle">Instrumentos en la tabla</text>
<path class="line s2" d="M486.0 329.5 L571.3 217.0 L656.7 162.5 L742.0 127.5"/><circle class="dot s2f" cx="486.0" cy="329.5" r="4"/><circle class="dot s2f" cx="571.3" cy="217.0" r="4"/><circle class="dot s2f" cx="656.7" cy="162.5" r="4"/><circle class="dot s2f" cx="742.0" cy="127.5" r="4"/><path class="line s1" d="M486.0 327.9 L571.3 217.4 L656.7 162.5 L742.0 126.9"/><circle class="dot s1f" cx="486.0" cy="327.9" r="4"/><circle class="dot s1f" cx="571.3" cy="217.4" r="4"/><circle class="dot s1f" cx="656.7" cy="162.5" r="4"/><circle class="dot s1f" cx="742.0" cy="126.9" r="4"/><rect class="sw s1b" x="752" y="122.92995523071333" width="8" height="8" rx="1.5"/><text class="val" x="765" y="130.92995523071335">132 ms</text>
<rect class="sw s2b" x="752" y="137.92995523071335" width="8" height="8" rx="1.5"/><text class="val" x="765" y="145.92995523071335">129 ms</text>
</svg>
