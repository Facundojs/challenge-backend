<title id="t">Inserciones por segundo según el tamaño de la tabla</title>
<desc id="d">Con uuid v7 el throughput se mantiene cerca de 750 mil filas por segundo. Con uuid aleatorio baja de 500 mil a unas 150 mil. El índice compuesto cae de forma parecida pero más abajo.</desc>
<style>
